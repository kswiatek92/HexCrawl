# Local development stack. Two ways to run it (CLAUDE.md → Local dev setup):
#
#   docker compose up --build             # everything in containers: postgres, redis,
#                                         # migrate, api (uvicorn --reload), worker,
#                                         # beat, frontend (Vite dev server on :5173)
#   docker compose up -d postgres redis   # hybrid: infra only; run uvicorn + Vite
#                                         # on the host via uv / pnpm
#
# The full mode keeps the host clean — no .venv / node_modules land in the repo.
# Source is bind-mounted read-only, so edits hot-reload (uvicorn --reload, Vite
# HMR) with no image rebuild; frontend `pnpm install` writes into a named volume,
# never the host tree. Dev-only credentials — never reuse in any deployed
# environment.

# Shared config for the Python services (api, worker, beat, migrate). All build
# and run the SAME image (Dockerfile at repo root) and differ only by command —
# build once, run many roles. `image:` tags that single build so the other
# services reuse it instead of rebuilding. `./src` is bind-mounted over the
# baked-in copy so code edits reach the containers without a rebuild (the api
# hot-reloads; worker/beat need `docker compose restart worker beat`).
x-app-base: &app-base
  build: .
  image: hexcrawl:dev
  environment: &app-env
    JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret}    # required by Settings() at import; override via shell/.env, dev fallback
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
  volumes:
    - ./src:/app/src:ro
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hexcrawl
      POSTGRES_PASSWORD: hexcrawl
      POSTGRES_DB: hexcrawl
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — host app reaches it via localhost; not exposed to the LAN
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume → data survives `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexcrawl -d hexcrawl"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"   # loopback only — host app reaches it via localhost; not exposed to the LAN
    # No volume: Redis here is an ephemeral cache / active-session store (rebuildable).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # One-shot: bring the schema to head, then exit 0 — mirrors the prod compose,
  # so `docker compose up` needs no host-run `alembic upgrade head`. The alembic
  # tree is bind-mounted (overriding the anchor's src-only mount) so a migration
  # you just autogenerated runs without an image rebuild.
  migrate:
    <<: *app-base
    restart: "no"
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://hexcrawl:hexcrawl@postgres:5432/hexcrawl
    volumes:
      - ./src:/app/src:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  # FastAPI app — dev server with hot reload. The image's default CMD is the
  # production server (gunicorn); dev swaps it for uvicorn --reload watching
  # the bind-mounted src. SUPABASE_URL passes through from the shell / root
  # .env — it's needed to verify JWTs on protected routes; left empty, those
  # routes fail loudly (Settings raises) while public ones still work.
  api:
    <<: *app-base
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://hexcrawl:hexcrawl@postgres:5432/hexcrawl
      REDIS_URL: redis://redis:6379/0
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    command: uvicorn src.entrypoints.http.main:app --reload --reload-dir /app/src --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"   # loopback only; the frontend container reaches it via http://api:8000 instead
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery worker — consumes tasks from the broker. score_recalc + the weekly
  # reset hit Postgres; map_generation writes the Redis cache — hence both
  # DATABASE_URL and REDIS_URL point at the compose service names (not localhost).
  # Gated on migrate (like prod) so it never sees a pre-head schema.
  worker:
    <<: *app-base
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://hexcrawl:hexcrawl@postgres:5432/hexcrawl
      REDIS_URL: redis://redis:6379/0
    command: celery -A src.adapters.tasks.celery_app worker --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery Beat — the periodic-task scheduler (weekly leaderboard reset, Mon
  # 00:00 UTC). It only *publishes* due tasks to the broker, so it needs Redis
  # but no database. MUST stay a singleton: two Beat instances on one schedule
  # dispatch every job twice. Never run more than one — do not `--scale beat`.
  beat:
    <<: *app-base
    # --schedule under /tmp: the shared image runs non-root (task 6.1), so
    # Beat can't write its bookkeeping DB into /app; the file is derived
    # state, rebuilt from the configured schedule on every boot.
    command: celery -A src.adapters.tasks.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy

  # Frontend — Vite dev server in a container. The tree is bind-mounted for
  # HMR; /app/node_modules is shadowed by a named volume so `pnpm install`
  # never writes into the host tree (the point of the containerised mode).
  # The pnpm store is pinned INSIDE that volume: pnpm hard-links store →
  # node_modules, which needs one filesystem — left at its default (a third
  # filesystem), pnpm silently falls back to creating .pnpm-store in the
  # project dir, i.e. on the host. corepack's download cache gets a volume so
  # restarts don't re-fetch pnpm. VITE_SUPABASE_* still come from the
  # bind-mounted frontend/.env (Vite loads it itself); only the proxy target
  # is set here, because "the backend" is the api service, not localhost.
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"   # corepack fetches the pinned pnpm@9 non-interactively (no TTY to answer its prompt)
    command: sh -c "corepack enable && pnpm install --frozen-lockfile --store-dir /app/node_modules/.pnpm-store && pnpm dev --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - corepack_cache:/root/.cache/node/corepack
    ports:
      - "127.0.0.1:5173:5173"   # browse here — Vite proxies /api and /ws to the api container
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  frontend_node_modules:
  corepack_cache:
